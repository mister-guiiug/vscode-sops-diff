name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # `.nvmrc` FAIT FOI. Le numéro était recopié ici, et recopier c'est
          # laisser diverger : la CI éprouvait une version que personne ne
          # faisait tourner en local, où rien ne fixait la sienne.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
